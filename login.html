<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login — YourBrand</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white shadow-lg rounded-lg w-full max-w-md p-6">

    <h1 class="text-2xl font-bold mb-2 text-center">Welcome Back</h1>
    <p class="text-gray-500 text-center mb-6">
      Login to your account
    </p>

    <!-- Google Login -->
    <button
      onclick="googleLogin()"
      class="w-full flex items-center justify-center border py-2 rounded mb-4 hover:bg-gray-100"
    >
      <img
        src="https://developers.google.com/identity/images/g-logo.png"
        class="w-5 h-5 mr-2"
      />
      Continue with Google
    </button>

    <div class="flex items-center my-4">
      <div class="flex-1 border-t"></div>
      <span class="px-3 text-sm text-gray-400">or</span>
      <div class="flex-1 border-t"></div>
    </div>

    <form id="loginForm" class="space-y-4">
      <input
        type="email"
        placeholder="Email"
        required
        class="w-full border p-2 rounded"
      />

      <input
        type="password"
        placeholder="Password"
        required
        class="w-full border p-2 rounded"
      />

      <button
        type="submit"
        class="w-full bg-black text-white py-2 rounded hover:bg-gray-800"
      >
        Login
      </button>
    </form>

    <p class="text-sm text-center mt-4 text-gray-500">
      Don’t have an account?
      <a href="signup.html" class="text-black font-medium">Sign Up</a>
    </p>

  </div>

<script>
  document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();
    window.location.href = "dashboard.html";
  });

  function googleLogin() {
    window.location.href = "dashboard.html";
  }
</script>

</body>
</html>
